<body>

<nav class="nav" aria-label="Site navigation">

    <a href="index.html" class="nav-brand">

<script>document.getElementById('nav-app-store-link').href = APP_STORE_URL;</script>

<div class="wrap--narrow">

  <div class="legal-hero">
    <p class="legal-hero__eyebrow">Changelog</p>
    <h1 class="legal-hero__title">Updates</h1>
  </div>

  <div class="updates-list" id="updates-list">
    <!-- Populated by JavaScript from updates.json -->
    <noscript>
      <div class="update">
        <div class="update__meta">
          <div class="update__version">1.0</div>
          <div class="update__date">Oct 30, 2026</div>
        </div>
        <div class="update__content">
          <h3>First release</h3>
          <p>Dynamic Stats is here. Live analytics in your Dynamic Island.</p>
        </div>
      </div>
    </noscript>
  </div>

</div>

<footer>
  <div class="wrap footer-inner">
    <span class="footer-brand">
      <img src="assets/app-icon.png" alt="">
      Dynamic Stats
    </span>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="updates.html">Updates</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="mailto:noah_mcclung@icloud.com">Contact</a>
    </nav>
  </div>
</footer>

<script>
  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  fetch('updates.json')
    .then(r => r.json())
    .then(entries => {
      const list = document.getElementById('updates-list');
      list.innerHTML = '';
      // Newest first — the JSON should be authored newest-first too, but sort as a safeguard
      entries
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date))
        .forEach(entry => {
          const bulletsHtml = entry.bullets && entry.bullets.length
            ? `<ul>${entry.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`
            : '';
          const bodyHtml = entry.body
            ? `<p>${entry.body}</p>`
            : '';
          list.insertAdjacentHTML('beforeend', `
            <div class="update">
              <div class="update__meta">
                <div class="update__version">${entry.version}</div>
                <div class="update__date">${formatDate(entry.date)}</div>
              </div>
              <div class="update__content">
                <h3>${entry.title}</h3>
                ${bodyHtml}
                ${bulletsHtml}
              </div>
            </div>
          `);
        });
    })
    .catch(() => {
      // fetch fails on file:// (browser blocks cross-origin requests)
      // Serve the site from a local server or GitHub Pages to see the changelog.
      document.getElementById('updates-list').innerHTML =
        '<p style="padding:40px 0;color:var(--label)">Open this page from a web server (or GitHub Pages) to see the changelog.</p>';
    });
</script>

</body>
</html>
